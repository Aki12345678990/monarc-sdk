[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "analyzer_core"
version = "0.1.0a2"
description = "Static Android APK analyzer. Phase 1A implements intake, isolation, the report schema, and the CLI."
requires-python = ">=3.12,<3.13"
dependencies = [
    "androguard==3.3.5",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
service = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.scripts]
analyzer = "analyzer_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
